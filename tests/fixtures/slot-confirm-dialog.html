<!-- Inferred navigation-dialog layout for regression tests, based on the
     user's two-blue-button description and an earlier step-2 screenshot.
     This is not a capture of the real post-selection dialog wording. -->
<div id="slot-modal" class="modal" role="dialog" aria-label="Hinweis" style="display:inline-block;position:relative;padding:20px;background:#eee">
  <div id="TevisDialog" class="modal-content" style="box-sizing:border-box;width:600px;padding:20px;background:#fff">
    <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center">
      <h3>Hinweis zu Ihrem Termin</h3><button type="button" aria-label="Schließen" style="background:transparent;border:0">×</button>
    </div>
    <p>Sie haben einen Termin ausgewählt. Bitte gehen Sie zum nächsten Schritt.</p>
    <div class="modal-footer" style="display:flex;justify-content:space-between;gap:20px;margin-top:35px">
      <button id="slot-dialog-left" type="button" style="box-sizing:border-box;width:200px;height:48px;background:rgb(44,80,147);color:white;border:0">Zurück</button>
      <button id="slot-dialog-right" type="button" style="box-sizing:border-box;width:200px;height:48px;background:rgb(44,80,147);color:white;border:0"><span aria-hidden="true">›</span> Weiter</button>
    </div>
  </div>
</div>
